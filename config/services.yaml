# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    assets_directory: '%kernel.project_dir%/public/assets'
    image_directory: '%kernel.project_dir%/public/assets/img'
    factions:
        - { nom: 'Imperial', titre: 'Familles Impériales' }
        - { nom: 'Crabe', titre: 'Clan du Crabe' }
        - { nom: 'Dragon', titre: 'Clan du Dragon' }
        - { nom: 'Grue', titre: 'Clan de la Grue' }
        - { nom: 'Licorne', titre: 'Clan de la Licorne' }
        - { nom: 'Lion', titre: 'Clan du Lion' }
        - { nom: 'Phénix', titre: 'Clan du Phénix' }
        - { nom: 'Scorpion', titre: 'Clan du Scorpion' }
        - { nom: 'Confrérie', titre: 'Confrérie de Shinsei' }
        - { nom: 'Blaireau', titre: 'Clan Mineur du Blaireau' }
        - { nom: 'Faucon', titre: 'Clan Mineur du Faucon' }
        - { nom: 'Guêpe', titre: 'Clan Mineur de la Guêpe' }
        - { nom: 'Libellule', titre: 'Clan Mineur de la Libellule' }
        - { nom: 'Lièvre', titre: 'Clan Mineur du Lièvre' }
        - { nom: 'Mante', titre: 'Clan Mineur de la Mante' }
        - { nom: 'Mille-pattes', titre: 'Clan Mineur du Mille-pattes' }
        - { nom: 'Moineau', titre: 'Clan Mineur du Moineau' }
        - { nom: 'Renard', titre: 'Clan Mineur du Renard' }
        - { nom: 'Tortue', titre: 'Clan Mineur de la Tortue' }
        - { nom: 'Adeptes du Sang', titre: 'Adeptes du Sang' }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    App\Service\Uploader:
        arguments:
            $targetDirectory: '%image_directory%'

    App\Service\SheetExport:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'

    App\Service\ImageBrightness:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
