<IfModule mod_ssl.c>
    <VirtualHost *:443>
        DocumentRoot /var/www/html/public

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/axljdr-selfsigned.crt
        SSLCertificateKeyFile /etc/ssl/private/axljdr-selfsigned.key

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
